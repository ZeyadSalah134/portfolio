<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="16" fill="#080c14" stroke="rgba(0, 242, 254, 0.4)" stroke-width="2"/>
  <!-- Neural Network Mesh Nodes -->
  <circle cx="18" cy="18" r="3.5" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="46" cy="18" r="3.5" fill="#4facfe" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="18" cy="46" r="3.5" fill="#4facfe" filter="url(#glow)"/>
  <circle cx="46" cy="46" r="3.5" fill="#6366f1" filter="url(#glow)"/>
  <!-- Connecting Synapse Lines -->
  <line x1="18" y1="18" x2="32" y2="32" stroke="url(#grad)" stroke-width="1.8" opacity="0.8"/>
  <line x1="46" y1="18" x2="32" y2="32" stroke="url(#grad)" stroke-width="1.8" opacity="0.8"/>
  <line x1="18" y1="46" x2="32" y2="32" stroke="url(#grad)" stroke-width="1.8" opacity="0.8"/>
  <line x1="46" y1="46" x2="32" y2="32" stroke="url(#grad)" stroke-width="1.8" opacity="0.8"/>
  <line x1="18" y1="18" x2="46" y2="18" stroke="#00f2fe" stroke-width="1" opacity="0.4" stroke-dasharray="2 2"/>
  <line x1="18" y1="46" x2="46" y2="46" stroke="#6366f1" stroke-width="1" opacity="0.4" stroke-dasharray="2 2"/>
</svg>
